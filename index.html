<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rand Calculator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Rand Calculator">
<meta name="theme-color" content="#0b6e4f">
<style>
:root { --bg:#fff; --fg:#111; --muted:#666; --card:#f1f3f2; --accent:#0b6e4f; --warn:#b45309; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111; --fg:#f2f2f2; --muted:#9a9a9a; --card:#1d2220; --accent:#3ecf9b; --warn:#fbbf24; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#111; --fg:#f2f2f2; --muted:#9a9a9a; --card:#1d2220; --accent:#3ecf9b; --warn:#fbbf24; color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; min-height:100dvh; background:var(--bg); color:var(--fg); font:16px system-ui, sans-serif; display:flex; flex-direction:column; }
main { flex:1; width:100%; max-width:34rem; margin:0 auto; padding:1.25rem 1rem; display:flex; flex-direction:column; justify-content:center; gap:1.25rem; }
.row { display:flex; align-items:center; gap:.75rem; background:var(--card); border-radius:1.25rem; padding:1.25rem 1.5rem; min-height:7rem; }
#amount { flex:1; min-width:0; border:0; background:transparent; color:inherit; font:inherit; font-size:3.25rem; font-weight:600; outline:none; }
#cur { font-size:1.75rem; color:var(--muted); font-weight:700; }
#swap { align-self:center; width:5rem; height:5rem; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:2.4rem; cursor:pointer; }
#result { font-size:clamp(3rem, 15vw, 5rem); font-weight:700; text-align:center; word-break:break-word; background:var(--card); border-radius:1.25rem; padding:1.5rem 1rem; }
#homerow { display:flex; justify-content:center; align-items:center; gap:.75rem; color:var(--muted); font-weight:600; }
#home > * { padding:0; font-size:1.3rem; }
#rateline { font-size:.95rem; color:var(--muted); text-align:center; }
#note { font-size:.85rem; color:var(--muted); text-align:center; }
#warn { color:var(--warn); text-align:center; font-weight:600; }
#warn:empty { display:none; }
header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:.5rem; padding:.75rem; }
#inst-top[hidden] { display:none; }
#inst-top > span { height:2.5rem; padding:0 .9rem; font-size:.95rem; opacity:1; }
.pill { display:flex; gap:.25rem; padding:.3rem; border:0; border-radius:2rem; background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
.pill > * { min-width:3rem; height:3rem; padding:0 1rem; display:grid; place-items:center; border-radius:1.5rem; font-size:1.1rem; font-weight:600; opacity:.55; border:0; background:transparent; color:inherit; font-family:inherit; cursor:pointer; transition:background .25s, opacity .25s; }
.pill > .on { background:var(--accent); color:#fff; opacity:1; }
#refresh > * { padding:0; font-size:1.5rem; }
#refresh.busy > * { animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
#theme > * { padding:0; font-size:1.5rem; }
.views { display:grid; grid-template-columns:minmax(0,1fr); overflow-x:clip; }
.view { grid-area:1/1; display:flex; flex-direction:column; gap:1.25rem; transition:opacity .3s, transform .3s, visibility .3s; }
.view.off { opacity:0; visibility:hidden; pointer-events:none; max-height:0; overflow:hidden; transition:opacity .3s, transform .3s, visibility .3s, max-height 0s .3s; }
#v-calc.off { transform:translateX(-2rem); }
#v-table.off { transform:translateX(2rem); }
#tbl-head { display:flex; justify-content:space-between; align-items:center; font-size:1.25rem; font-weight:700; color:var(--muted); padding:0 .5rem; }
#tbl-head button { width:3.5rem; height:3.5rem; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:1.6rem; cursor:pointer; }
table { width:100%; border-collapse:separate; border-spacing:0 .5rem; }
td { background:var(--card); padding:.9rem 1.25rem; font-size:1.6rem; font-weight:600; font-variant-numeric:tabular-nums; }
td:first-child { border-radius:1rem 0 0 1rem; color:var(--muted); }
td:last-child { border-radius:0 1rem 1rem 0; text-align:right; }
.view:not(.off) tr { animation:rowin .4s both; animation-delay:calc(var(--i) * 35ms); }
@keyframes rowin { from { opacity:0; transform:translateY(.75rem); } }
@media (prefers-reduced-motion: reduce) { .view, .view tr { transition:none; animation:none !important; } }
#install { display:flex; align-items:center; gap:.75rem; margin:0 1rem 1rem; padding:1rem 1.25rem; border-radius:1rem; background:var(--card); font-size:1rem; line-height:1.4; max-width:34rem; align-self:center; }
#install[hidden] { display:none; }
#install span { flex:1; }
#install button { border:0; border-radius:2rem; padding:.7rem 1.1rem; font:inherit; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; }
#install #inst-close { background:transparent; color:var(--muted); font-size:1.5rem; padding:.2rem .6rem; }
</style>
</head>
<body>
<header>
  <div class="pill" role="tablist">
    <button id="tab-calc" class="on" type="button" role="tab">Calculator</button>
    <button id="tab-table" type="button" role="tab">Table</button>
  </div>
  <button id="inst-top" class="pill" type="button" aria-label="Install app" hidden><span>⤓ Install</span></button>
  <button id="refresh" class="pill" type="button" aria-label="Reload app and check for new rates"><span>⟳</span></button>
  <button id="theme" class="pill" type="button" aria-label="Toggle light/dark mode"><span id="t-light">☀️</span><span id="t-dark">🌙</span></button>
</header>
<main>
  <div class="views">
    <section id="v-calc" class="view">
      <label class="row">
        <input id="amount" inputmode="decimal" autocomplete="off" autofocus aria-label="Amount">
        <span id="cur">ZAR</span>
      </label>
      <button id="swap" type="button" aria-label="Switch direction">⇅</button>
      <div id="result" aria-live="polite">–</div>
    </section>
    <section id="v-table" class="view off">
      <div id="tbl-head"><span id="th-from">ZAR</span><button id="swap2" type="button" aria-label="Switch direction">⇅</button><span id="th-to">EUR</span></div>
      <table><tbody id="tbody"></tbody></table>
    </section>
  </div>
  <div id="homerow">Card currency
    <button id="home" class="pill" type="button" aria-label="Switch card currency: euro or US dollar"><span id="h-EUR">€</span><span id="h-USD">$</span></button>
  </div>
  <div id="rateline"></div>
  <div id="note">The rate is the ECB reference rate and only changes when the ECB publishes a new one (once per working day, around 16:00 CET).</div>
  <div id="warn"></div>
</main>
<div id="install" hidden>
  <span id="inst-text"></span>
  <button id="inst-go" type="button" hidden>Install</button>
  <button id="inst-close" type="button" aria-label="Close">✕</button>
</div>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let rate = null; // { eurPerZar, usdPerZar, source, asOf }
let offline = false;
const root = document.documentElement;
const isDark = () => (root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function applyTheme(t) {
  if (t) root.dataset.theme = t;
  $('t-light').classList.toggle('on', !isDark());
  $('t-dark').classList.toggle('on', isDark());
}
$('theme').addEventListener('click', () => {
  const t = isDark() ? 'light' : 'dark';
  store.set('theme', t);
  applyTheme(t);
});
const savedTheme = store.get('theme');
applyTheme(savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : null);
// zarToEur: Richtung ZAR → Kartenwährung (EUR oder USD)
let zarToEur = store.get('dir') !== 'eur2zar';
let home = store.get('home') === 'USD' ? 'USD' : 'EUR';
const SYM = { EUR: '€', USD: '$' };
const perZar = () => Number(rate?.[home === 'USD' ? 'usdPerZar' : 'eurPerZar']) || 0;
const from = () => (zarToEur ? 'ZAR' : home);
const to = () => (zarToEur ? home : 'ZAR');

const fmt = (n, currency) => new Intl.NumberFormat('en-GB', { style: 'currency', currency }).format(n);
const fmtRate = (n, d) => new Intl.NumberFormat('en-GB', { maximumFractionDigits: d }).format(n);

// Komma = Dezimaltrenner; Punkt vor genau 3 Ziffern = Tausender (1.000); bei beiden zählt das letzte Zeichen
function parse(s) {
  let t = s.replace(/\s/g, '');
  const c = t.lastIndexOf(','), d = t.lastIndexOf('.');
  if (c >= 0 && d >= 0) t = c > d ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
  else if (c >= 0) t = t.replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  return /^(\d+\.?\d*|\.\d+)$/.test(t) ? parseFloat(t) : NaN;
}
function convert(v) {
  return zarToEur ? v * perZar() : v / perZar();
}

const AMOUNTS = {
  ZAR: [10, 20, 50, 100, 150, 200, 300, 400, 500, 750, 1000, 1500, 2000],
  EUR: [5, 10, 20, 50, 100, 150, 200, 300, 500, 1000],
  USD: [5, 10, 20, 50, 100, 150, 200, 300, 500, 1000],
};
function renderTable() {
  $('th-from').textContent = from();
  $('th-to').textContent = to();
  const f0 = new Intl.NumberFormat('en-GB', { style: 'currency', currency: from(), maximumFractionDigits: 0 });
  $('tbody').innerHTML = AMOUNTS[from()].map((a, i) =>
    `<tr style="--i:${i}"><td>${f0.format(a)}</td><td>${perZar() ? fmt(convert(a), to()) : '–'}</td></tr>`).join('');
}

function showView(calc) {
  $('v-calc').classList.toggle('off', !calc);
  $('v-table').classList.toggle('off', calc);
  $('tab-calc').classList.toggle('on', calc);
  $('tab-table').classList.toggle('on', !calc);
  if (calc) $('amount').focus();
}
$('tab-calc').addEventListener('click', () => showView(true));
$('tab-table').addEventListener('click', () => showView(false));

function render() {
  $('cur').textContent = from();
  $('h-EUR').classList.toggle('on', home === 'EUR');
  $('h-USD').classList.toggle('on', home === 'USD');
  renderTable();
  if (!perZar()) {
    $('result').textContent = '–';
    $('rateline').textContent = '';
    $('warn').textContent = 'No rate loaded yet – open once while online';
    return;
  }
  const v = parse($('amount').value);
  $('result').textContent = Number.isFinite(v) ? fmt(convert(v), to()) : '–';
  const [y, m, d] = rate.asOf.split('-');
  const src = rate.source === 'visa' ? 'Visa' : 'ECB';
  const sym = SYM[home];
  $('rateline').textContent =
    `1 ZAR = ${fmtRate(perZar(), 4)} ${sym} · 1 ${sym} = ${fmtRate(1 / perZar(), 2)} ZAR · ${src}, as of ${d}/${m}/${y}`;
  const warn = [];
  if (Date.now() - new Date(rate.asOf + 'T00:00:00Z') > 3 * 86400000) warn.push('Rate is outdated');
  if (offline) warn.push('Offline – last saved rate');
  $('warn').textContent = warn.join(' · ');
}

$('amount').addEventListener('input', render);
function swapDirection() {
  const v = parse($('amount').value);
  const next = perZar() && Number.isFinite(v) ? convert(v) : NaN;
  zarToEur = !zarToEur;
  store.set('dir', zarToEur ? 'zar2eur' : 'eur2zar');
  $('amount').value = Number.isFinite(next) ? (Math.round(next * 100) / 100).toString() : '';
  render();
}
$('swap').addEventListener('click', swapDirection);
$('swap2').addEventListener('click', swapDirection);
$('home').addEventListener('click', () => {
  home = home === 'EUR' ? 'USD' : 'EUR';
  store.set('home', home);
  render();
});

async function loadRate() {
  try {
    const r = await fetch('rate.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    rate = await r.json();
    store.set('rate', JSON.stringify(rate));
    offline = false;
  } catch {
    try { rate = JSON.parse(store.get('rate')); } catch { rate = null; }
    offline = true;
  }
  render();
}

// Installation: Karte bei den ersten 3 Starts, danach Knopf oben; nicht wenn schon installiert
const starts = (parseInt(store.get('starts'), 10) || 0) + 1;
store.set('starts', String(starts));
let installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let installPrompt = null;
const ua = navigator.userAgent;
const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
$('inst-text').textContent = ios
  ? 'Install app: Share icon → “Add to Home Screen”'
  : /Android/.test(ua)
    ? 'Install app: menu ⋮ → “Install app”'
    : 'Install app: icon in the address bar or menu → “Install page as app”';
function syncInstall() {
  $('install').hidden = $('install').hidden || installed;
  $('inst-top').hidden = installed || !$('install').hidden;
  $('inst-go').hidden = !installPrompt;
}
async function doInstall() {
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  syncInstall();
}
$('install').hidden = !(starts <= 3 && !store.get('hintClosed'));
syncInstall();
$('inst-close').addEventListener('click', () => {
  $('install').hidden = true;
  store.set('hintClosed', '1');
  syncInstall();
});
$('inst-top').addEventListener('click', () => {
  if (installPrompt) return doInstall();
  $('install').hidden = false;
  syncInstall();
});
$('inst-go').addEventListener('click', doInstall);
addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installPrompt = e;
  syncInstall();
});
addEventListener('appinstalled', () => { installed = true; syncInstall(); });

// Neu laden: Service-Worker-Update anstoßen, dann Seite neu laden (Start und rate.json sind network-first)
$('refresh').addEventListener('click', async () => {
  $('refresh').classList.add('busy');
  try { await (await navigator.serviceWorker?.getRegistration())?.update(); } catch {}
  location.reload();
});

addEventListener('online', loadRate);
addEventListener('offline', () => { offline = true; render(); });
render();
loadRate();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
